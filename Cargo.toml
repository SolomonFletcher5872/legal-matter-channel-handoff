[package]
name = "legal-matter-onboarding"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "legal_matter_onboarding"
path = "src/lib.rs"

[[bin]]
name = "matter_onboard"
path = "src/bin/matter_onboard.rs"
